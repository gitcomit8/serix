name: Bug report
description: Report a reproducible Serix issue
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please include enough detail to reproduce the issue. Redact sensitive host information from logs.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: qemu
    attributes:
      label: QEMU command line
      description: Include the full command, including machine, CPU, SMP, devices, and acceleration options.
      render: shell
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host OS and version
      placeholder: e.g. Ubuntu 24.04 x86_64
    validations:
      required: true
  - type: dropdown
    id: kvm
    attributes:
      label: KVM status
      options:
        - Enabled
        - Disabled (TCG)
        - Not available / unsure
    validations:
      required: true
  - type: textarea
    id: serial
    attributes:
      label: Serial output / panic trace
      description: Paste serial output, including the panic trace or last checkpoint before failure.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. ...
    validations:
      required: true
