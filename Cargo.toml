[workspace]
resolver = "3"
members = ["kernel",
    "acpi",
    "memory",
    "hal",
    "apic",
    "idt",
    "graphics",
    "util",
    "task",
    "keyboard",
    "capability",
    "drivers",
    "vfs",
    "ipc",
    "ipc_types",
    "loader", "ulib", "fs", "ext4d", "policyd"]

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
